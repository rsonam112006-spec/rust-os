[package]
name = "rust-micro-os"
version = "2.0.0"
edition = "2021"
authors = ["CA-6 Engineering Student <student@os-course.edu>"]
description = "A modern Micro-OS in Rust with network stack (TCP/IP/ICMP/HTTP) and macOS & Windows 11 fluent desktop GUI"
license = "MIT"

[features]
default = ["std"]
std = []
baremetal = []

[dependencies]

[[bin]]
name = "rust-micro-os"
path = "src/main.rs"

[lib]
name = "micro_os"
path = "src/lib.rs"

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.release]
opt-level = 2
panic = "abort"
