# Rust OS - GRUB 2 Bootloader Configuration
# Topic: Page Replacement Under Locality of Reference
# 64-bit Bare-Metal Rust Kernel

set timeout=2
set default=0

# Configure Video & Serial Console Output
insmod font
insmod all_video
insmod gfxterm
insmod serial

# Serial terminal at 115200 baud for VirtualBox / COM1 debugging
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm serial

set gfxmode=auto
set gfxpayload=keep

menuentry "Rust OS - 64-bit Bare-Metal Kernel" --class os {
    echo "Loading Rust OS Kernel..."
    multiboot /boot/kernel.bin
    boot
}
